version: '3'

# Run tasks with `wails3 task <name>` (or `task <name>` if go-task is installed).

vars:
  APP_NAME: "kanopa"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # On Windows, Docker Engine runs inside WSL (see test/ldap/README.md).
  DOCKER: '{{if eq OS "windows"}}wsl.exe -- docker{{else}}docker{{end}}'
  LDAP_IMAGE: kanopa-test-ldap:dev
  LDAP_CONTAINER: kanopa-ldap
  # Lint, SAST and hook tools, pinned, installed into bin/tools (never your global GOPATH).
  TOOLS_DIR: '{{toSlash .ROOT_DIR}}/bin/tools'
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  LEFTHOOK_VERSION: v2.2.2

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  # ---------- Test directory ----------

  docker:up:
    summary: Makes sure a Docker daemon answers (on Windows, Docker Engine inside WSL on localhost:2375)
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/docker-wsl.ps1
        platforms: [windows]
      - cmd: docker version --format "Docker {{"{{"}}.Server.Version{{"}}"}}"
        platforms: [darwin, linux]

  ldap:build:
    summary: Builds the OpenLDAP test image from test/ldap
    deps: [docker:up]
    sources:
      - test/ldap/Dockerfile
      - test/ldap/slapd.conf
      - test/ldap/seed.ldif
    cmds:
      - '{{.DOCKER}} build -q -t {{.LDAP_IMAGE}} test/ldap'

  ldap:seed:
    summary: Regenerates test/ldap/seed.ldif from test/ldap/seedgen
    cmds:
      - go run ./test/ldap/seedgen > test/ldap/seed.ldif

  ldap:up:
    summary: Starts the test directory on localhost:389 (plain, StartTLS) and localhost:636 (LDAPS)
    deps: [ldap:build]
    cmds:
      - cmd: '{{.DOCKER}} rm -f {{.LDAP_CONTAINER}}'
        ignore_error: true
        silent: true
      - '{{.DOCKER}} run -d --name {{.LDAP_CONTAINER}} -p 389:389 -p 636:636 {{.LDAP_IMAGE}}'
      - cmd: echo "Test directory up. Admin cn=admin,dc=example,dc=org / kanopa-admin. See test/ldap/README.md."
        silent: true

  ldap:down:
    summary: Stops and removes the test directory
    cmds:
      - '{{.DOCKER}} rm -f {{.LDAP_CONTAINER}}'

  ldap:stop:
    summary: Stops the test directory without removing it (to see how Kanopa reacts)
    cmds:
      - '{{.DOCKER}} stop {{.LDAP_CONTAINER}}'

  ldap:start:
    summary: Starts a stopped test directory again
    cmds:
      - '{{.DOCKER}} start {{.LDAP_CONTAINER}}'

  ldap:search:
    summary: 'Prints one entry as the server holds it. Usage: wails3 task ldap:search DN=uid=ada,ou=people,dc=example,dc=org'
    requires:
      vars: [DN]
    cmds:
      - '{{.DOCKER}} exec {{.LDAP_CONTAINER}} kanopa-search "{{.DN}}"'

  # ---------- Lint, SAST and git hooks ----------

  tools:
    summary: Installs the pinned lint, SAST and hook tools into bin/tools
    env:
      GOBIN: '{{.TOOLS_DIR}}'
    status:
      - '{{.TOOLS_DIR}}/golangci-lint{{exeExt}} version | grep -q "{{trimPrefix "v" .GOLANGCI_LINT_VERSION}}"'
      - '{{.TOOLS_DIR}}/govulncheck{{exeExt}} -version | grep -q "{{.GOVULNCHECK_VERSION}}"'
      - '{{.TOOLS_DIR}}/lefthook{{exeExt}} version | grep -q "{{trimPrefix "v" .LEFTHOOK_VERSION}}"'
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
      - go install github.com/evilmartians/lefthook/v2@{{.LEFTHOOK_VERSION}}
      - task: common:install:frontend:deps

  hooks:install:
    summary: Installs the git hooks (pre-commit lint + SAST, pre-push vulnerability scans)
    deps: [tools]
    cmds:
      - '{{.TOOLS_DIR}}/lefthook install'

  lint:
    summary: All linters and SAST (what the pre-commit hook runs, on every file)
    cmds:
      - task: lint:go
      - task: lint:web

  lint:go:
    summary: golangci-lint with gosec (SAST), staticcheck, errcheck, errorlint, gofmt, goimports
    deps: [tools]
    cmds:
      - '{{.TOOLS_DIR}}/golangci-lint run ./internal/... ./services/... ./test/... .'

  lint:web:
    summary: Oxlint (TypeScript, React hooks, jsx-a11y) and tsc
    dir: frontend
    cmds:
      - npx oxlint --deny-warnings
      - npx tsc

  security:
    summary: Known vulnerabilities in what Kanopa calls and ships (govulncheck, npm audit)
    deps: [tools]
    cmds:
      - '{{.TOOLS_DIR}}/govulncheck ./...'
      - cmd: npm audit --omit=dev --audit-level=moderate
        dir: frontend

  # ---------- Tests ----------

  test:
    summary: Runs every automated test layer
    cmds:
      - task: test:go
      - task: test:web
      - task: test:e2e
      - task: test:it

  test:go:
    summary: Go unit tests
    cmds:
      - go test ./internal/... ./services/...

  test:it:
    summary: Go integration tests against the OpenLDAP fixture (needs Docker)
    deps: [docker:up]
    cmds:
      - cmd: go test -tags integration -count=1 ./internal/... ./services/...
        platforms: [darwin, linux]
      - cmd: DOCKER_HOST=tcp://localhost:2375 TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock go test -tags integration -count=1 ./internal/... ./services/...
        platforms: [windows]

  test:web:
    summary: Frontend component and unit tests (Vitest)
    dir: frontend
    cmds:
      - npm run test

  test:e2e:
    summary: User flows in a browser against the fake backend (Playwright)
    dir: frontend
    cmds:
      - npm run test:e2e
