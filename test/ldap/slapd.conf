include   /etc/openldap/schema/core.schema
include   /etc/openldap/schema/cosine.schema
include   /etc/openldap/schema/inetorgperson.schema
include   /etc/openldap/schema/nis.schema

pidfile   /run/openldap/slapd.pid
argsfile  /run/openldap/slapd.args

modulepath /usr/lib/openldap
moduleload back_mdb.so
moduleload ppolicy.so

TLSCACertificateFile  /etc/openldap/tls/ca.crt
TLSCertificateFile    /etc/openldap/tls/server.crt
TLSCertificateKeyFile /etc/openldap/tls/server.key

# 500 entries per plain search, unlimited through the paged results control.
sizelimit size.soft=500 size.hard=unlimited size.prtotal=unlimited

database  mdb
maxsize   1073741824
suffix    "dc=example,dc=org"
rootdn    "cn=admin,dc=example,dc=org"
rootpw    @ROOTPW@
directory /var/lib/openldap/openldap-data

index objectClass eq
index uid,cn,mail,sn,givenName eq,sub
index member,uniqueMember eq

# Passwords: people bind with their own; nobody reads them.
access to attrs=userPassword
  by self write
  by anonymous auth
  by * none

# A policy only the rootdn can read: the case of a policy a reader cannot see.
access to dn.exact="cn=restricted,ou=policies,dc=example,dc=org"
  by * none

# Everything else: readable by anyone, writable only by the rootdn (cn=admin).
# uid=svc-kanopa is therefore a read-only account.
access to *
  by users read
  by anonymous read

# Password policy (ppolicy): lockout, ageing and must-change, read from ou=policies.
# This overlay line stays last: directives below it would belong to the overlay.
overlay   ppolicy
ppolicy_default "cn=default,ou=policies,dc=example,dc=org"
